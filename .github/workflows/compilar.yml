name: Compilar Halo Forge Evolved

# Compila el APK de Android de Halo Forge Evolved (Map Creation Studio) con el
# codigo de este mismo repositorio: el de Halo Content Evolved (Watanoge) con
# los cambios de la Forja. Pasa los menus al espanol (espanol/traducir.py) solo
# en la copia que se compila, y deja el APK en Releases.
# - main: la version oficial ("Halo Forge Evolved", com.halo.contentevolved.forja).
# - cualquier otra rama (pruebas): un borrador privado, que solo ve el dueno, y
#   otra app ("Forge PRUEBA", com.halo.contentevolved.forja.pruebas).

on:
  push:
    branches:
      - main
      - pruebas
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: apk-forja-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

env:
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G

jobs:
  android:
    # La imagen del runner trae el SDK y el NDK de Android, un JDK y CMake.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          curl -fsSL -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz
          sha256sum -c - <<'HASHES'
          6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255  ninja.zip
          80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18  ccache.tar.xz
          HASHES
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools" && rm ninja.zip
          tar -xJf ccache.tar.xz -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache && rm ccache.tar.xz
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Codigo de este repositorio
        uses: actions/checkout@v4

      # Para dibujar las palabras del menu en espanol
      - name: Dependencias del menu en espanol
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil python3-numpy python3-scipy

      - name: Espanol, nombre y paquete de la app
        run: |
          /usr/bin/python3 espanol/traducir.py
          # El nombre en el celular y el paquete propio: el de Content Evolved
          # (com.halo.contentevolved) con .forja (HALO_APPLICATION_ID_SUFFIX de
          # build.gradle). No choca con Content Evolved, Halo C.E ni Halo C.E
          # Evolved. Las pruebas son otra app mas.
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            nombre="Halo Forge Evolved"; sufijo=".forja"
          else
            nombre="Forge PRUEBA"; sufijo=".forja.pruebas"
          fi
          sed -i "s#<string name=\"app_name\">Halo</string>#<string name=\"app_name\">$nombre</string>#" port/android/app/src/main/res/values/strings.xml
          grep -q "<string name=\"app_name\">$nombre</string>" port/android/app/src/main/res/values/strings.xml
          echo "HALO_APPLICATION_ID_SUFFIX=$sufijo" >> "$GITHUB_ENV"
          git status --short | head -50

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-android-forja-${{ github.sha }}
          restore-keys: ccache-android-forja-

      - uses: actions/cache@v4
        with:
          path: build/android/third_party
          key: android-forja-third-party-${{ hashFiles('tools/android_build.py', 'port/android/patches/**') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}

      # La llave de firma (secretos ANDROID_KEYSTORE_BASE64 y
      # ANDROID_KEYSTORE_PASSWORD): con ella cada version se instala encima de
      # la anterior sin borrar los mapas.
      - name: Llave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/halo.keystore"
            echo "HALO_ANDROID_KEYSTORE=$RUNNER_TEMP/halo.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Faltan los secretos de firma: cada APK queda con una firma distinta"
          fi

      # Sin numero de compilacion (env -u GITHUB_REF) la app no busca
      # actualizaciones de Content Evolved, que no son esta app.
      - name: Compilar el APK (release)
        env:
          HALO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: env -u GITHUB_REF python3 tools/ci_build.py android release

      - name: Compile cache
        run: ccache --show-stats

      - name: Ubicar el APK
        run: |
          for d in dist/halo-contentevolved-release dist/halo-android-release; do
            if [ -f "$d/app-release.apk" ]; then
              mkdir -p dist/forja
              cp "$d/app-release.apk" dist/forja/
              echo "APK: $d/app-release.apk"
              break
            fi
          done
          test -f dist/forja/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: halo-forge-evolved-android-release
          path: dist/forja
          # las pruebas solo un dia: en un repositorio publico cualquiera con
          # cuenta de GitHub puede descargar un artifact
          retention-days: ${{ github.ref_name == 'main' && 7 || 1 }}

      - name: Publicar el APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTAS="Halo Forge Evolved (Map Creation Studio): la Forja de Halo Content Evolved como app aparte, para crear mapas de Halo CE y exportarlos, en espanol. Se instala al lado de Halo C.E y de Halo C.E Evolved. La primera vez pide tu imagen de disco de Xbox (.iso o .xiso) y saca los mapas."
          CAMBIOS=$(git log -1 --format='%s%n%n%b' | grep -v '^Co-Authored-By\|^Claude-Session' | sed '/./,$!d')
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            APK="HaloForgeEvolved-n${{ github.run_number }}.apk"
            cp dist/forja/app-release.apk "$APK"
            gh release create "forja-$(date +%Y%m%d-%H%M)" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Halo Forge Evolved (#${{ github.run_number }})" \
              --notes "$(printf '%s\n\n## Cambios\n%s' "$NOTAS" "$CAMBIOS")" \
              --latest
          else
            # Las pruebas son privadas: BORRADOR (draft), que solo ve el dueno.
            # Se borran las pruebas anteriores.
            for viejo in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,name \
                --jq '.[] | select(.isDraft and (.name | startswith("FORGE PRUEBA"))) | .tagName'); do
              gh release delete "$viejo" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            done
            APK="HaloForgeEvolved-PRUEBA-n${{ github.run_number }}.apk"
            cp dist/forja/app-release.apk "$APK"
            gh release create "forja-prueba-$(date +%Y%m%d-%H%M)" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "FORGE PRUEBA ($GITHUB_REF_NAME) (#${{ github.run_number }})" \
              --notes "$(printf 'Version de PRUEBA de la rama %s: puede tener errores. Borrador privado: solo lo ve el dueno del repositorio.\n\n%s\n\n## Cambios\n%s' "$GITHUB_REF_NAME" "$NOTAS" "$CAMBIOS")" \
              --draft
          fi

      # Si algo falla, abre un aviso en Issues con el enlace al error. Uno solo a la vez.
      - name: Avisar del error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITULO="Fallo la compilacion de Halo Forge Evolved"
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITULO\" in:title" --json number --jq '.[].number')" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" --body "$(printf 'La compilacion de Halo Forge Evolved (rama %s) fallo.\n\nError: %s/%s/actions/runs/%s' "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          else
            echo "Ya hay un aviso abierto"
          fi
