plugins {
    id "com.android.application"
}

// build/android in the repository root, where `ninja android` stages the
// native libraries (jniLibs) and the guest image (assets)
def staged = new File(rootDir, "../../build/android")

// a release's build knows its number (tools/ci_build.py, from the tag), which names its
// release and which the self-updater (Updater.java) compares; others have
// none and never look for updates
def buildNumberText = System.getenv("HALO_BUILD_NUMBER") ?: "0"
def buildNumber = buildNumberText.isInteger() ? buildNumberText.toInteger() : 0

// the workflow's signing key (.github/workflows/build.yml): every build of
// main signed with it can install over the one before; without it, the
// debug key of the computer that builds
def signingKey = System.getenv("HALO_ANDROID_KEYSTORE")

// HALO_APPLICATION_ID_SUFFIX (for example ".vk") installs a build beside the one from
// GitHub Actions, which another signing key stops it from replacing, with data of its own
// (port/android/VULKAN.md)
def applicationIdSuffix = System.getenv("HALO_APPLICATION_ID_SUFFIX") ?: ""
// the app is com.halo.contentevolved; up to build 141 it was com.halo.decomp, OpenCE's id, which
// is now the bridge (port/android/bridge), the old app's last update: it hands its files over
// to this app (Migration.java) and installs it
def applicationIdBase = "com.halo.contentevolved"
def legacyPackage = "com.halo.decomp" + applicationIdSuffix

// the launcher's static shortcut names the app's id, which a resource cannot take from Gradle:
// written here, for this build's id
def generatedResources = new File(projectDir, "build/generated/res/shortcuts")
new File(generatedResources, "xml").mkdirs()
new File(generatedResources, "xml/mcc_shortcuts.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<!-- written by app/build.gradle, for this build's application id -->
<shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
    <shortcut android:shortcutId="mcc_import" android:enabled="true"
        android:shortcutShortLabel="@string/mcc_import_label">
        <intent android:action="android.intent.action.VIEW"
            android:targetPackage="${applicationIdBase + applicationIdSuffix}" android:targetClass="com.halo.decomp.MccImportActivity" />
    </shortcut>
</shortcuts>
"""

android {
    namespace "com.halo.decomp"
    compileSdk 35

    defaultConfig {
        applicationId applicationIdBase + applicationIdSuffix
        minSdk 28
        targetSdk 35
        versionCode Math.max(1, buildNumber)
        versionName buildNumber > 0 ? "build " + buildNumber : "1.0"
        buildConfigField "int", "HALO_BUILD_NUMBER", "${buildNumber}"
        buildConfigField "String", "LEGACY_PACKAGE", "\"${legacyPackage}\""
        manifestPlaceholders = [legacyPackage: legacyPackage]
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            java.srcDirs += new File(staged, "third_party/SDL3/android-project/app/src/main/java")
            res.srcDirs += generatedResources
            jniLibs.srcDirs = [new File(staged, "jniLibs")]
            assets.srcDirs = [new File(staged, "assets")]
        }
    }

    // the guest image is read straight from the APK
    androidResources {
        noCompress += ["elf"]
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (signingKey) {
            halo {
                storeFile file(signingKey)
                storePassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HALO_ANDROID_KEY_ALIAS") ?: "halo"
                keyPassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
